# Local development environment for IMSI.
#
#   docker compose up --build      # first time, or after changing dependencies
#   docker compose up              # every other time
#
# Frontend:  http://localhost:5173      API:  http://localhost:8000/api/health/
# Mailpit (captured emails):  http://localhost:8025
name: imsi

x-backend: &backend
  image: imsi-backend:dev
  build:
    context: ./backend
    target: dev
  env_file: .env
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "8025:8025"

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keeps the container's own node_modules instead of the host's (Windows) copy.
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
